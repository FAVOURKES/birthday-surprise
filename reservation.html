<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>An Evening Reserved For You</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

.fade-in{
    opacity:0;
    animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:linear-gradient(
        180deg,
        #F8F4EE 0%,
        #F2EBE3 50%,
        #ECE3DA 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;
}

.card{

    max-width:700px;
    width:100%;

    background:white;

    padding:70px 50px;

    border-radius:35px;

    text-align:center;

    box-shadow:
    0 30px 80px rgba(0,0,0,.08);

    opacity:0;
    animation:fadeIn 2s ease forwards;

}

.small{

    font-family:'Inter',sans-serif;

    letter-spacing:4px;

    color:#A08A76;

    margin-bottom:20px;
}

h1{

    font-family:'Cormorant Garamond',serif;

    color:#4F3F35;

    font-size:70px;

    margin-bottom:30px;
}

.date{

    font-family:'Inter',sans-serif;

    font-size:22px;

    color:#6D5E54;

    margin:15px 0;
}

.restaurant{

    margin-top:40px;

    padding-top:40px;

    border-top:1px solid #eee;
}

.restaurant h2{

    font-family:'Cormorant Garamond',serif;

    color:#4F3F35;

    font-size:50px;
}

.restaurant p{

    font-family:'Inter',sans-serif;

    color:#7D6D61;

    margin-top:10px;
}

.question{

    margin-top:50px;

    font-family:'Cormorant Garamond',serif;

    color:#4F3F35;

    font-size:45px;
}

.btn{

    display:inline-block;

    margin-top:35px;

    padding:18px 40px;

    background:#D8C3A5;

    border-radius:50px;

    text-decoration:none;

    color:#4F3F35;

    font-family:'Inter',sans-serif;

    transition:.3s;
}

.btn:hover{

    transform:translateY(-4px);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:768px){

    h1{
        font-size:50px;
    }

    .restaurant h2{
        font-size:36px;
    }

    .question{
        font-size:32px;
    }

}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:40px;
}

.buttons button{
    padding:16px 24px;
    border:none;
    border-radius:50px;
    background:#D8C3A5;
    color:#4F3F35;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.buttons button:hover{
    transform:translateY(-4px);
    background:#CDB393;
}

@media (max-width: 768px){

    .buttons{
        gap:8px;
    }

    .buttons button{
        padding:14px 18px;
        font-size:14px;
    }

}

confirmation-card{

    display:none;

    margin-top:40px;

    background:white;

    max-width:600px;

    margin-left:auto;
    margin-right:auto;

    padding:40px;

    border-radius:30px;

    box-shadow:0 20px 50px rgba(0,0,0,0.08);

    animation:fadeIn 1s ease;
}

.confirmation-card h2{

    font-family:'Cormorant Garamond', serif;

    color:#4F3F35;

    font-size:50px;

    margin-bottom:20px;
}

.confirmation-card p{

    font-family:'Inter', sans-serif;

    color:#756459;

    margin:12px 0;
}

.line{

    letter-spacing:3px;

    text-transform:uppercase;

    color:#B49C86;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* MOBILE */

@media screen and (max-width:768px){

    body{
        padding:20px;
    }

    h1{
        font-size:45px !important;
    }

    h2{
        font-size:32px !important;
    }

    p{
        font-size:16px !important;
        line-height:1.8;
    }

    .card,
    .container{
        width:100%;
        padding:25px;
    }

    .buttons{
        display:flex;
        justify-content:center;
        gap:10px;
    }

    .buttons button,
    .btn{
        font-size:14px;
        padding:12px 18px;
    }

    img{
        max-width:100%;
        height:auto;
    }

}

</style>

</head>
<body>

<div class="card">

    <div class="small">
        AN EVENING RESERVED FOR YOU
    </div>

    <h1>Your Birthday Surprise</h1>

    <div class="date">
        ✨ November 14, 2026
    </div>

    <div class="date">
        🕗 8:00 PM
    </div>

    <div class="restaurant">

        <h2>Frankie's Italian Kitchen</h2>

        <p>
            505 Sterling Lyon Parkway
        </p>

    </div>

    <div class="question">

         Would you like to make a birthday memory with me? 

    </div>


</div>

<div class="buttons">

    <a href="confirmed.html" class="btn">
         Yes 🤍
    </a>

    <a href="confirmed.html" class="btn">
        Fucking Yes! ✨
    </a>

</body>
</html>
