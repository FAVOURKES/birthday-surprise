<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#F7F3EE;
    overflow:hidden;
    font-family:'Cormorant Garamond', serif;
}

/* CONTAINER */

.hero{
    position:relative;
    height:100vh;
    overflow:hidden;
    background:#F7F3EE;
}

/* TOP ROW */

.top-row{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:45vh;
    overflow:hidden;
}

/* BOTTOM ROW */

.bottom-row{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:45vh;
    overflow:hidden;
}

/* TRACKS */

.track-right,
.track-left{
    display:flex;
    height:100%;
    width:max-content;
}

.track-right{
    animation:moveRight 45s linear infinite;
}

.track-left{
    animation:moveLeft 45s linear infinite;
}

/* IMAGES */

.track-right img,
.track-left img{

    width:260px;
    height:100%;

    object-fit:cover;

    margin-right:12px;

    border-radius:24px;

    box-shadow:0 12px 25px rgba(0,0,0,0.08);
}

/* CENTER CONTENT */

.content{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:100;

    width:90%;
}

.content h1{

    font-size:120px;

    line-height:0.9;

    color:#4B3A31;

    font-weight:600;
}

.content p{

    margin-top:25px;

    font-size:24px;

    font-weight:700;

    letter-spacing:1px;
    
    text-transform:uppercase;

    text-shadow:0 2px 10px rgba(255,255,255,0.5);

    color:#4B3A31;
}

/* BUTTON */

.continue-btn{

    display:inline-block;

    margin-top:40px;

    padding:18px 45px;

    background:#D8C3A5;

    color:#4B3A31;

    text-decoration:none;

    border-radius:999px;

    font-size:20px;

    transition:0.3s;
}

.continue-btn:hover{

    transform:translateY(-4px);

    background:#CEB596;
}

/* ANIMATIONS */

@keyframes moveRight{

    from{
        transform:translateX(-50%);
    }

    to{
        transform:translateX(0);
    }

}

@keyframes moveLeft{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}

/* MOBILE */

@media(max-width:768px){

    .top-row,
    .bottom-row{
        height:28vh;
    }

    .track-right img,
    .track-left img{
        width:160px;
    }

    .content h1{
        font-size:60px;
    }

    .content p{
        font-size:14px;
        letter-spacing:1px;
    }

    .continue-btn{
        font-size:16px;
        padding:14px 28px;
    }

}

</style>
</head>

<body>

<section class="hero">

    <div class="top-row">
        <div class="track-right">

            <img src="./Images/birthday1.jpeg">
            <img src="./Images/birthda2.jpeg">
            <img src="./Images/birthday3.jpeg">

            <img src="./Images/birthday1.jpeg">
            <img src="./Images/birthda2.jpeg">
            <img src="./Images/birthday3.jpeg">

        </div>
    </div>

<div class="bottom-row">
    <div class="track-left">

        <img src="./Images/birthday1.jpeg">
        <img src="./Images/birthda2.jpeg">
        <img src="./Images/birthday3.jpeg">

        <img src="./Images/birthday1.jpeg">
        <img src="./Images/birthda2.jpeg">
        <img src="./Images/birthday3.jpeg">

    </div>

</div>

<div class="content">

<h1>HAPPY<br>BIRTHDAY</h1>

<p>
A little birthday experience made especially for you
</p>
